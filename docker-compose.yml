services:
  # Ollama service for LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-falcon3:1b}
    restart: unless-stopped
    # Note: Ollama will run on CPU in Docker
    # For Qualcomm NPU acceleration, run Ollama natively on Windows with QNN support
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-data}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-data}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sensor API - Sensor Data Collection
  backend_api:
    build:
      context: ./sensor-api
      dockerfile: Dockerfile
    container_name: backend_sensor_api
    ports:
      - "8001:8001"
    volumes:
      - ./sensor-api:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-data}
      - BLYNK_TOKEN=${BLYNK_TOKEN:?set BLYNK_TOKEN in .env}
      - AI_SERVICE_URL=http://lstm_api:8000
    depends_on:
      postgres:
        condition: service_healthy
      lstm_api:
        condition: service_started
    restart: unless-stopped

  # Freshness API - LSTM Food Freshness Prediction
  lstm_api:
    build:
      context: ./freshness-api
      dockerfile: Dockerfile
    container_name: food_freshness_ai
    ports:
      - "8000:8000"
    volumes:
      - ./freshness-api:/app
      - ./freshness-api/models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
